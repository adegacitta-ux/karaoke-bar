<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Exibição - Karaokê Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');
        * { font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .display-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 60px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 1000px;
            width: 100%;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .titulo-proximo {
            font-size: 48px;
            color: #666;
            margin-bottom: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cantor-nombre {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .musica-info {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            padding: 40px;
            border-radius: 20px;
            margin: 30px 0;
        }

        .musica-titulo {
            font-size: 48px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .musica-artista {
            font-size: 36px;
            color: #666;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .veces-cantadas {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 600;
        }

        .fila-info {
            margin-top: 40px;
            display: flex;
            justify-content: space-around;
            font-size: 32px;
        }

        .fila-stat {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            padding: 20px 40px;
            border-radius: 15px;
            flex: 1;
            margin: 0 10px;
        }

        .stat-numero {
            font-size: 48px;
            font-weight: 900;
            color: #667eea;
        }

        .stat-label {
            font-size: 18px;
            color: #666;
            margin-top: 10px;
        }

        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 15px;
            z-index: 50;
        }

        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(102, 126, 234, 0); }
        }

        @media (max-width: 1024px) {
            .display-card {
                padding: 40px;
            }

            .cantor-nombre {
                font-size: 52px;
            }

            .titulo-proximo {
                font-size: 36px;
            }

            .musica-titulo {
                font-size: 36px;
            }

            .musica-artista {
                font-size: 28px;
            }
        }

        @media (max-width: 768px) {
            .display-card {
                padding: 30px;
            }

            .logo {
                font-size: 60px;
            }

            .cantor-nombre {
                font-size: 40px;
            }

            .titulo-proximo {
                font-size: 28px;
            }

            .musica-titulo {
                font-size: 28px;
            }

            .musica-artista {
                font-size: 22px;
            }

            .fila-info {
                flex-direction: column;
            }

            .fila-stat {
                margin: 10px 0;
            }

            .veces-cantadas {
                font-size: 18px;
            }
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 40;
            transition: transform 0.3s;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
        }

        .timer {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .firebase-status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Status Firebase -->
    <div class="firebase-status" id="firebase-status">
        <i class="fas fa-circle mr-2" style="animation: pulse 1s infinite;"></i>
        <span id="status-text">🔥 Conectado ao Firebase</span>
    </div>

    <!-- Timer -->
    <div class="timer">
        <i class="fas fa-hourglass-half mr-2"></i><span id="tempo-display">0 min</span>
    </div>

    <!-- Botón Fullscreen -->
    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Pantalla completa">
        <i class="fas fa-expand"></i>
    </button>

    <!-- Contenedor Principal -->
    <div class="main-container">
        <div class="display-card pulse" id="display-card">
            
            <!-- Estado Inicial -->
            <div id="estado-inicial" class="hidden">
                <div class="logo">🎤</div>
                <h1 class="titulo-proximo">Karaokê Pro</h1>
                <p style="font-size: 32px; color: #999;">Aguardando próxima música...</p>
            </div>

            <!-- Fila Vazia -->
            <div id="fila-vazia" class="hidden">
                <div class="logo">🎵</div>
                <h1 class="titulo-proximo">Fila Encerrada</h1>
                <p style="font-size: 32px; color: #999; margin-top: 20px;">Obrigado por participar!</p>
            </div>

            <!-- Apresentação em Andamento ou Próximo Cantor -->
            <div id="proximo-cantor" class="hidden">
                <div class="logo">🎤</div>
                <h1 class="titulo-proximo" id="titulo-apresentacao">Próximo a Cantar</h1>
                
                <div class="cantor-nombre" id="cantor-nombre">-</div>
                
                <div class="musica-info">
                    <div class="musica-titulo" id="musica-titulo">-</div>
                    <div class="musica-artista" id="musica-artista">-</div>
                    <div style="margin-top:12px;" id="avaliacao-info"></div>
                    <div class="veces-cantadas" id="veces-cantadas">0x</div>
                </div>

                <div class="fila-info">
                    <div class="fila-stat">
                        <div class="stat-numero" id="proximos-na-fila">0</div>
                        <div class="stat-label">Próximos na Fila</div>
                    </div>
                    <div class="fila-stat">
                        <div class="stat-numero" id="tempo-espera-display">0</div>
                        <div class="stat-label">min de Espera</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Barra de Control -->
    <div class="control-bar">
        <button class="control-btn" onclick="atualizarDisplay()">
            <i class="fas fa-sync mr-2"></i>Atualizar
        </button>
        <button class="control-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left mr-2"></i>Voltar
        </button>
        <button class="control-btn" onclick="resetarDisplay()">
            <i class="fas fa-redo mr-2"></i>Resetar
        </button>
    </div>

    <script>
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBianYFsS5_8z6HDlBnucOi53qdz2qzj2A",
            authDomain: "karaokebar-7a67f.firebaseapp.com",
            databaseURL: "https://karaokebar-7a67f-default-rtdb.firebaseio.com",
            projectId: "karaokebar-7a67f",
            storageBucket: "karaokebar-7a67f.firebasestorage.app",
            messagingSenderId: "747385059296",
            appId: "1:747385059296:web:1faf5d09f15413441a9d85",
            measurementId: "G-1WZ9VRTQ67"
        };

        let db = null;
        let firebaseConnected = false;
        const TEMPO_MEDIO_MUSICA = 5; // minutos

        // Inicializar Firebase
        function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                firebaseConnected = true;
                console.log('✅ Firebase inicializado en display.html');
                atualizarDisplay();
                
                // Sincronizar cada cambio en tiempo real
                const ref = db.ref('karaoke');
                ref.on('value', (snapshot) => {
                    console.log('📡 Datos actualizados en tiempo real');
                    atualizarDisplayWithData(snapshot.val());
                });
            } catch (error) {
                console.error('❌ Error Firebase:', error);
                firebaseConnected = false;
            }
        }

        function calcularMediaAvaliacoes(avaliacoes) {
            const notas = Object.values(avaliacoes || {}).map(n => Number(n)).filter(n => !isNaN(n));
            if (notas.length === 0) return null;
            const soma = notas.reduce((a,b) => a + b, 0);
            return Number((soma / notas.length).toFixed(2));
        }

        function atualizarDisplay() {
            if (!firebaseConnected || !db) {
                console.warn('⚠️ Firebase no disponible');
                return;
            }

            const ref = db.ref('karaoke');
            ref.once('value', (snapshot) => {
                atualizarDisplayWithData(snapshot.val());
            }).catch((error) => {
                console.error('❌ Error al obtener datos:', error);
            });
        }

        function atualizarDisplayWithData(data) {
            // Ocultar todos los estados
            document.getElementById('estado-inicial').classList.add('hidden');
            document.getElementById('fila-vazia').classList.add('hidden');
            document.getElementById('proximo-cantor').classList.add('hidden');

            // Actualizar status firebase badge
            const statusText = document.getElementById('status-text');
            if (firebaseConnected) {
                statusText.innerText = '🔥 Conectado ao Firebase';
            } else {
                statusText.innerText = '⚠️ Offline';
            }

            if (!data) {
                document.getElementById('estado-inicial').classList.remove('hidden');
                document.getElementById('tempo-display').innerText = '0 min';
                return;
            }

            // Se houver uma apresentação em andamento, priorizamos ela
            if (data.apresentacaoAtual) {
                const ap = data.apresentacaoAtual;
                const media = calcularMediaAvaliacoes(ap.avaliacoes);
                const votos = Object.keys(ap.avaliacoes || {}).length;

                document.getElementById('titulo-apresentacao').innerText = 'Apresentação em Andamento';
                document.getElementById('cantor-nombre').innerText = ap.nome || '-';
                document.getElementById('musica-titulo').innerText = ap.musica || '-';
                document.getElementById('musica-artista').innerText = ap.artista || '-';

                const avalArea = document.getElementById('avaliacao-info');
                if (media !== null) {
                    avalArea.innerHTML = `<div style="font-size:18px;color:#333;font-weight:700;">Avaliação média: ★ ${media} <span style="font-size:12px;color:#666;margin-left:8px;">(${votos} voto(s))</span></div>`;
                } else {
                    avalArea.innerHTML = `<div style="font-size:16px;color:#666;">Sem avaliações ainda — incentive o público a votar!</div>`;
                }

                // vezes cantadas: se disponível no nó (poder vir com o objeto), senão '-' 
                document.getElementById('veces-cantadas').innerText = '-';

                // info de fila
                const fila = data.fila || [];
                document.getElementById('proximos-na-fila').innerText = Math.max(0, fila.length);
                const tempoEstimado = Math.max(0, fila.length) * TEMPO_MEDIO_MUSICA;
                document.getElementById('tempo-espera-display').innerText = tempoEstimado;
                document.getElementById('tempo-display').innerText = tempoEstimado + ' min';

                document.getElementById('proximo-cantor').classList.remove('hidden');
                return;
            }

            // Sem apresentacaoAtual: usamos a fila para mostrar o próximo
            const fila = data.fila || [];
            if (!fila || fila.length === 0) {
                if (data.manualFechada) {
                    document.getElementById('fila-vazia').classList.remove('hidden');
                } else {
                    document.getElementById('estado-inicial').classList.remove('hidden');
                }
                document.getElementById('tempo-display').innerText = '0 min';
                return;
            }

            const proximo = fila[0];
            document.getElementById('titulo-apresentacao').innerText = 'Próximo a Cantar';
            document.getElementById('cantor-nombre').innerText = proximo.nome || '-';
            document.getElementById('musica-titulo').innerText = proximo.musica || '-';
            document.getElementById('musica-artista').innerText = proximo.artista || '-';
            document.getElementById('veces-cantadas').innerText = (typeof proximo.vezesCantadas !== 'undefined') ? `${proximo.vezesCantadas + 1}ª vez` : '-';

            document.getElementById('proximos-na-fila').innerText = Math.max(0, fila.length - 1);
            const tempoEstimado = Math.max(0, fila.length - 1) * TEMPO_MEDIO_MUSICA;
            document.getElementById('tempo-espera-display').innerText = tempoEstimado;
            document.getElementById('tempo-display').innerText = tempoEstimado + ' min';

            document.getElementById('proximo-cantor').classList.remove('hidden');
        }

        function resetarDisplay() {
            if (confirm('Deseja resetar o display?')) {
                atualizarDisplay();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Erro ao entrar em tela cheia: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Inicialización
        window.addEventListener('load', () => {
            console.log('📺 Display.html carregado');
            initFirebase();
        });
    </script>
</body>
</html>
